<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Waved In bouncer mark">
<defs><pattern id="ckb" width="32" height="32" patternUnits="userSpaceOnUse"><rect width="32" height="32" fill="#F5EBD3"/><rect width="16" height="16" fill="#0A1118"/><rect x="16" y="16" width="16" height="16" fill="#0A1118"/></pattern><clipPath id="inner"><circle cx="200" cy="200" r="156"/></clipPath></defs>
<circle cx="200" cy="200" r="194" fill="#0A1118"/>
<path d="M200 8 a192 192 0 1 0 0.01 0 Z M200 44 a156 156 0 1 1 -0.01 0 Z" fill="url(#ckb)" fill-rule="evenodd"/>
<circle cx="200" cy="200" r="192" fill="none" stroke="#0A1118" stroke-width="8"/>
<circle cx="200" cy="200" r="156" fill="#0B1620" stroke="#0A1118" stroke-width="8"/>
<g clip-path="url(#inner)">
  <circle cx="200" cy="200" r="110" fill="#36D6C3" opacity=".12"/>
  <g transform="translate(10 18) scale(1.9)"><g class="bouncer-head">
  <!-- headset band -->
  <path d="M54 92 C52 30 148 30 146 92" fill="none" stroke="#0A1118" stroke-width="15" stroke-linecap="round"/>
  <path d="M54 92 C52 30 148 30 146 92" fill="none" stroke="#33434F" stroke-width="7" stroke-linecap="round"/>
  <!-- neck -->
  <rect x="84" y="136" width="32" height="22" rx="4" fill="#5E6E79" stroke="#0A1118" stroke-width="6"/>
  <path d="M86 146 H114" stroke="#0A1118" stroke-width="3"/>
  <!-- head -->
  <rect x="60" y="54" width="80" height="88" rx="20" fill="#AEBBC4" stroke="#0A1118" stroke-width="6"/>
  <path d="M68 72 Q70 62 82 61" fill="none" stroke="#E4ECF0" stroke-width="5" stroke-linecap="round"/>
  <path d="M134 120 Q133 134 120 136" fill="none" stroke="#7D8B95" stroke-width="5" stroke-linecap="round"/>
  <!-- stickers -->
  <rect x="112" y="60" width="18" height="11" rx="2" fill="#FF4D8D" stroke="#0A1118" stroke-width="3" transform="rotate(12 121 65)"/>
  <rect x="66" y="118" width="13" height="9" rx="2" fill="#F5EBD3" stroke="#0A1118" stroke-width="3" transform="rotate(-10 72 122)"/>
  <!-- visor -->
  <rect x="68" y="80" width="64" height="32" rx="11" fill="#0A1118"/>
  <rect x="79" y="88" width="16" height="16" rx="5" class="eye-glow" fill="#FF3B3B" opacity=".35"/>
  <rect class="eye-core" x="81" y="90" width="12" height="12" rx="4" fill="#FF6B6B"/>
  <rect class="eye-core" x="107" y="90" width="12" height="12" rx="4" fill="#FF6B6B"/>
  <rect x="79" y="88" width="16" height="16" rx="5" class="eye-ring" fill="none" stroke="#FF3B3B" stroke-width="2"/>
  <rect x="105" y="88" width="16" height="16" rx="5" class="eye-ring" fill="none" stroke="#FF3B3B" stroke-width="2"/>
  <!-- grin -->
  <path class="mouth-grin" opacity="0" d="M88 124 Q100 131 112 124" fill="none" stroke="#0A1118" stroke-width="4.5" stroke-linecap="round"/>
  <path class="mouth-flat" d="M89 127 L111 127" fill="none" stroke="#0A1118" stroke-width="4.5" stroke-linecap="round" opacity="1"/>
  <!-- ear cups -->
  <rect x="42" y="80" width="22" height="38" rx="9" fill="#33434F" stroke="#0A1118" stroke-width="6"/>
  <rect x="136" y="80" width="22" height="38" rx="9" fill="#33434F" stroke="#0A1118" stroke-width="6"/>
  <circle class="eye-led" cx="147" cy="99" r="4" fill="#FF3B3B"/>
  <!-- mic boom -->
  <path d="M146 116 Q148 140 120 140" fill="none" stroke="#0A1118" stroke-width="5" stroke-linecap="round"/>
  <rect x="110" y="135" width="13" height="10" rx="5" fill="#0A1118"/>
</g>
</g>
</g>
<circle cx="200" cy="200" r="156" fill="none" stroke="#F5EBD3" stroke-width="5"/>


</svg>
